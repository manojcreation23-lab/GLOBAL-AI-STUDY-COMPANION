<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | Global AI Study Companion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f1f1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 360px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;

            text-decoration: none;
            color: #111;

            font-weight: bold;
        }

        .calculator {
            background: #181818;
            padding: 20px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);
        }

        .title {
            color: white;
            text-align: center;

            margin-bottom: 15px;
        }

        #display {
            width: 100%;
            height: 80px;

            border: none;
            outline: none;

            border-radius: 10px;

            background: #080808;
            color: white;

            font-size: 32px;

            text-align: right;

            padding: 10px;

            margin-bottom: 15px;
        }

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 60px;

            border: none;

            border-radius: 10px;

            background: #3b3b3b;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .operator {
            background: #ff9500;
        }

        .clear {
            background: #d9534f;
        }

        .equals {
            background: #28a745;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="../index.html" class="back">
        ← Back to Global AI Study Companion
    </a>

    <div class="calculator">

        <h2 class="title">
            🧮 Calculator
        </h2>

        <input
            type="text"
            id="display"
            readonly
        >

        <div class="buttons">

            <button
                class="clear"
                onclick="clearDisplay()">
                AC
            </button>

            <button
                onclick="deleteLast()">
                DEL
            </button>

            <button
                onclick="appendValue('%')">
                %
            </button>

            <button
                class="operator"
                onclick="appendValue('/')">
                ÷
            </button>


            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button
                class="operator"
                onclick="appendValue('*')">
                ×
            </button>


            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button
                class="operator"
                onclick="appendValue('-')">
                −
            </button>


            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button
                class="operator"
                onclick="appendValue('+')">
                +
            </button>


            <button
                class="zero"
                onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button
                class="equals"
                onclick="calculate()">
                =
            </button>

        </div>

    </div>

</div>


<script>

const display =
    document.getElementById("display");


function appendValue(value) {

    display.value += value;

}


function clearDisplay() {

    display.value = "";

}


function deleteLast() {

    display.value =
        display.value.slice(0, -1);

}


function calculate() {

    try {

        if (display.value === "") {
            return;
        }

        let expression =
            display.value.replace(
                /%/g,
                "/100"
            );

        let result =
            Function(
                '"use strict"; return (' +
                expression +
                ")"
            )();

        if (!Number.isFinite(result)) {

            display.value = "Error";

            return;

        }

        display.value = result;

    }

    catch (error) {

        display.value = "Error";

    }

}


document.addEventListener(
    "keydown",
    function(event) {

        const key = event.key;

        if (
            (key >= "0" && key <= "9") ||
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "." ||
            key === "%"
        ) {

            appendValue(key);

        }


        if (
            key === "Enter" ||
            key === "="
        ) {

            calculate();

        }


        if (key === "Backspace") {

            deleteLast();

        }


        if (key === "Escape") {

            clearDisplay();

        }

    }
);

</script>

</body>
</html>
